name: Release

# Builds the stax CLI from the PRIVATE source repo (glassa-work/stax) using
# free public-repo minutes, and publishes the binaries as a release HERE so
# anyone can download them. The source never appears in this repo's history.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0"
        required: true
      source_ref:
        description: "Ref of glassa-work/stax to build from"
        required: true
        default: main

permissions:
  contents: write

env:
  SOURCE_REPO: glassa-work/stax

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the tag on this repo (dispatch only)
        if: inputs.tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/${{ steps.tag.outputs.name }}" \
            -f "sha=${{ github.sha }}" || true

      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.STAX_SOURCE_PAT }}
          fetch-depth: 0 # goreleaser wants history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/cli-go/go.mod

      - name: Test before releasing
        working-directory: platform/cli-go
        run: go test ./... -count=1

      - name: Retarget goreleaser at this repo + stamp the version
        run: |
          # Retarget the release at stax-cli and drop the brews section —
          # goreleaser refuses a dirty tree, so commit the patch and tag the
          # resulting commit (tag first and the version becomes v*-1-g<sha>).
          sed -i 's/name: homebrew-stax/name: stax-cli/' .goreleaser.yaml
          awk '/^brews:/{stop=1} !stop' .goreleaser.yaml > .goreleaser.stax-cli.yaml
          mv .goreleaser.stax-cli.yaml .goreleaser.yaml
          git config user.email "release@glassawork.bot"
          git config user.name "stax-cli release"
          git add .goreleaser.yaml
          git commit -qm "ci: retarget release at stax-cli"
          git tag "${{ steps.tag.outputs.name }}"

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
